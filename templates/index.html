<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Management System</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="background-glow"></div>

<header class="top-header">

    <div class="header-content">

        <span class="header-icon">&#9635;</span>

        <h1>Inventory Management System</h1>

    </div>

</header>

<main class="dashboard">

<section class="glass-card form-card">

<div class="card-title">

<h2>Add / Update Product</h2>

<span class="card-subtitle">

Fill in the details below

</span>

</div>

<form id="productForm" onsubmit="return false;">

<div class="form-grid">

<div class="input-group">

<label>Product ID</label>

<input
type="number"
id="productId"
placeholder="Enter Product ID"
required>

</div>

<div class="input-group">

<label>Product Name</label>

<input
type="text"
id="productName"
placeholder="Enter Product Name"
required>

</div>

<div class="input-group">

<label>Product Price</label>

<input
type="number"
id="productPrice"
placeholder="Enter Product Price"
required>

</div>

<div class="input-group">

<label>Product Category</label>

<input
type="text"
id="productCategory"
placeholder="Enter Product Category"
required>

</div>

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

</div>

<div class="input-group">

<label>OTP</label>

<input
type="text"
id="otp"
placeholder="Enter OTP">

</div>

</div>

<div class="button-row">

    <button type="button" class="btn btn-warning" onclick="sendOTP()">
        Send OTP
    </button>

    <button type="button" class="btn btn-success" onclick="verifyOTP()">
        Verify OTP
    </button>

    <button type="button" class="btn btn-primary" onclick="addProduct()">
        Add Product
    </button>

    <button type="button" class="btn btn-secondary" onclick="updateProduct()">
        Update Product
    </button>

    <button type="button" class="btn btn-ghost" onclick="clearForm()">
        Clear Form
    </button>

</div>

</form>

</section>

<section class="glass-card search-card">

<div class="card-title">

<h2>Search Product</h2>

<span class="card-subtitle">

Find Product by ID

</span>

</div>

<div class="search-row">

<input
type="number"
id="searchId"
placeholder="Enter Product ID">

<button
type="button"
class="btn btn-primary"
onclick="searchProduct()">

Search

</button>

</div>

</section>

<section class="glass-card table-card">

<div class="card-title">

<h2>Product Inventory</h2>

<span
id="productCount"
class="card-subtitle">

0 Products

</span>

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Price</th>

<th>Category</th>

<th>Edit</th>

<th>Delete</th>

</tr>

</thead>

<tbody id="productTableBody">

</tbody>

</table>

<div
id="emptyState"
class="empty-state"
style="display:none;">

No Products Found

</div>

</div>

</section>

</main>

<div id="toast" class="toast"></div>

<script src="/static/script.js"></script>

</body>

</html>
