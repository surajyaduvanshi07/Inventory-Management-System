<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Inventory Management Dashboard</title>

    <link
        rel="stylesheet"
        href="/static/style.css">

</head>

<body>

<div class="container">

<div class="dashboard-card">

<div class="header">

    <div>

        <h1>📦 Inventory Management</h1>

        <p class="user-email">

            Logged in as :

            <strong id="loggedUser">

                {{ email }}

            </strong>

        </p>

    </div>

    <button

        class="logout-btn"

        onclick="logout()">

        Logout

    </button>

</div>

<hr>

<br>

<h2 class="card-title">

    Add / Update Product

</h2>

<div class="form-grid">

<div class="input-group">

<label>

Product ID

</label>

<input

type="number"

id="productId"

placeholder="Enter Product ID">

</div>

<div class="input-group">

<label>

Product Name

</label>

<input

type="text"

id="productName"

placeholder="Enter Product Name">

</div>

<div class="input-group">

<label>

Product Price

</label>

<input

type="number"

id="productPrice"

placeholder="Enter Product Price">

</div>

<div class="input-group">

<label>

Product Category

</label>

<input

type="text"

id="productCategory"

placeholder="Enter Category">

</div>

</div>

<div class="button-row">

<button

class="btn btn-primary"

onclick="addProduct()">

Add Product

</button>

<button

class="btn btn-secondary"

onclick="updateProduct()">

Update

</button>

<button

class="btn btn-danger"

onclick="clearForm()">

Clear

</button>

</div>

<br>

<hr>

<br>

<h2 class="card-title">

Search Product

</h2>

<div class="search-box">

<input

type="number"

id="searchId"

placeholder="Enter Product ID">

<button

class="btn btn-success"

onclick="searchProduct()">

Search

</button>

</div>

<br>

<hr>

<br>

<h2 class="card-title">

Product Inventory

</h2>

<div class="table-container">
    <table id="productTable">

    <thead>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Price</th>

            <th>Category</th>

            <th>Edit</th>

            <th>Delete</th>

        </tr>

    </thead>

    <tbody id="productTableBody">

    </tbody>

</table>

<div
    id="emptyState"
    class="empty-state"
    style="display:none;">

    No Products Available

</div>

</div>

</div>

</div>

<script src="/static/dashboard.js"></script>

</body>

</html>
